[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true

[program:laravel-optimize]
command=/bin/sh -c "php /var/www/html/artisan optimize"
priority=1
autostart=true
autorestart=false
startsecs=5

