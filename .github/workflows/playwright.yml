name: Playwright Tests

on:
  push:
    branches: [ "fastcomet" ]
  pull_request:
    branches: [ "fastcomet" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------
    # PHP + Laravel Setup
    # -------------------------------
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, sqlite, pdo_sqlite
        coverage: none

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Copy .env
      run: cp .env .env

    - name: Generate app key
      run: php artisan key:generate

    # -------------------------------
    # Database Setup (SQLite)
    # -------------------------------
    - name: Setup SQLite database
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan migrate --force

    # Optional: Seed test users
    - name: Seed database
      run: php artisan db:seed --force

    # -------------------------------
    # Start Laravel Server
    # -------------------------------
    - name: Start Laravel server
      run: php artisan serve --port=8000 &
    
    - name: Wait for Laravel
      run: npx wait-on http://127.0.0.1:8000

    # -------------------------------
    # Node + Playwright Setup
    # -------------------------------
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM dependencies
      working-directory: laravel-playwright-poc
      run: npm install

    - name: Install Playwright Browsers
      working-directory: laravel-playwright-poc
      run: npx playwright install --with-deps

    # -------------------------------
    # Run Playwright Tests
    # -------------------------------
    - name: Run Playwright tests
      working-directory: laravel-playwright-poc
      run: npx playwright test --reporter=line

    # -------------------------------
    # Run BDD Tests
    # -------------------------------
  
    - name: Run Cucumber BDD Tests
      working-directory: laravel-playwright-poc
      run: npm run test:bdd 

    # -------------------------------
    # Upload Playwright HTML Report
    # -------------------------------
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: laravel-playwright-poc/playwright-report
        retention-days: 7

    # -------------------------------
    # Upload Allure Results
    # -------------------------------
    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: laravel-playwright-poc/allure-results
        retention-days: 7
  


 