name: Playwright Tests

on:
  push:
    branches: [ "fastcomet" ]
  pull_request:
    branches: [ "fastcomet" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

      # -------------------------------
      # PHP + Laravel Setup (ROOT)
      # -------------------------------

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo, sqlite, pdo_sqlite, tokenizer, xml, ctype, json
        coverage: none

    - uses: actions/checkout@v4

 #   - name: Copy .env
 #     run: php -r "file_exists('.env') || copy('.env.example', '.env');"
 
    - name: Use CI environment
      working-directory: .
      run: cp .env.ci .env

    # -------------------------------
    #  Laravel needs to write:
    #  - bootstrap/cache/packages.php
    #  - bootstrap/cache/services.php
    #  - bootstrap/cache/config.php
    #  - bootstrap/cache/events.php
    # -------------------------------

    - name: Ensure Laravel directories exist
      working-directory: .
      run: |
        mkdir -p storage/framework/cache/data
        mkdir -p storage/framework/sessions
        mkdir -p storage/framework/views
        mkdir -p storage/logs
        mkdir -p bootstrap/cache
        chmod -R 777 storage bootstrap/cache

    - name: Install Composer dependencies
      working-directory: .
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Generate app key
      working-directory: .
      run: php artisan key:generate

      # -------------------------------
      # Database Setup (ROOT)
      # -------------------------------
    - name: Setup SQLite database
      working-directory: .
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan migrate --force

    - name: Seed database
      working-directory: .
      run: php artisan db:seed --force

      # -------------------------------
      # Start Laravel Server (ROOT)
      # -------------------------------
    - name: Debug Laravel boot
      working-directory: .
      run: php artisan serve --port=8000 --verbose &

    - name: Test Laravel manually
      run: |
        sleep 2
        curl -v http://127.0.0.1:8000 || true

    - name: Wait for Laravel
      run: npx wait-on http://127.0.0.1:8000

      # -------------------------------
      # Playwright Setup (TEST FOLDER)
      # -------------------------------
    - name: Install NPM dependencies
      working-directory: laravel-playwright-poc
      run: npm install

    - name: Install Playwright Browsers
      working-directory: laravel-playwright-poc
      run: npx playwright install --with-deps

      # -------------------------------
      # Run Playwright Tests
      # -------------------------------
    - name: Run Playwright tests
      working-directory: laravel-playwright-poc
      run: npx playwright test --reporter=line

      # -------------------------------
      # Run BDD Tests
      # -------------------------------
    - name: Run Cucumber BDD Tests
      working-directory: laravel-playwright-poc
      run: npm run test:bdd

      # -------------------------------
      # Upload Playwright HTML Report
      # -------------------------------
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: laravel-playwright-poc/playwright-report
        retention-days: 7

      # -------------------------------
      # Upload Allure Results
      # -------------------------------
    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: laravel-playwright-poc/allure-results
        retention-days: 7

 